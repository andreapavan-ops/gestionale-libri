<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${libro.isbn != null} ? 'Modifica Libro' : 'Nuovo Libro'">Libro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>📚 Gestionale Biblioteca</h1>
        <p>Carlo & AnnaMaria</p>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/libri">Catalogo</a>
        <a href="/libri/nuovo" class="active">Aggiungi Libro</a>
        <a href="/wishlist">Wishlist</a>
        <a href="/libri/importa">Sincronizza</a>
    </nav>

    <main>
        <div class="form-container">
            <h2 th:text="${libro.isbn != null} ? 'Modifica Libro' : 'Aggiungi Nuovo Libro'">Form Libro</h2>

            <!-- Messaggi -->
            <div class="alert alert-error" th:if="${errore}" th:text="${errore}"></div>

            <form th:action="@{/libri/salva}" method="post" th:object="${libro}">
                <div class="form-group">
                    <label for="isbn">ISBN *</label>
                    <input type="text" id="isbn" th:field="*{isbn}" required
                           placeholder="es. 978-88-04-67847-7"
                           th:readonly="${libro.isbn != null}">
                    <small>Formato: ISBN-10 o ISBN-13</small>
                </div>

                <div class="form-group">
                    <label for="titolo">Titolo *</label>
                    <input type="text" id="titolo" th:field="*{titolo}" required
                           placeholder="Inserisci il titolo del libro">
                </div>

                <div class="form-group">
                    <label for="autore">Autore</label>
                    <input type="text" id="autore" th:field="*{autore}"
                           placeholder="Nome dell'autore">
                </div>

                <div class="form-group">
                    <label for="annoPubblicazione">Anno di Pubblicazione</label>
                    <input type="number" id="annoPubblicazione" th:field="*{annoPubblicazione}"
                           min="1000" max="2100" placeholder="es. 2023">
                </div>

                <div class="form-group">
                    <label for="genere">Genere</label>
                    <input type="text" id="genere" th:field="*{genere}"
                           placeholder="es. Romanzo, Fantasy, Thriller...">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <span th:text="${libro.isbn != null} ? 'Salva Modifiche' : 'Aggiungi Libro'">Salva</span>
                    </button>
                    <a href="/libri" class="btn btn-secondary">Annulla</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Gestionale Libri - Carlo & AnnaMaria - by Andrea Pavan</p>
    </footer>
</body>
</html>
