# Profilo PRODUZIONE - PostgreSQL su Railway
# La configurazione del DataSource viene gestita da DatabaseConfig.java
# che converte automaticamente DATABASE_URL nel formato JDBC corretto

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disabilita console H2 in produzione
spring.h2.console.enabled=false
